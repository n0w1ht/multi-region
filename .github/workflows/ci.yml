name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 27.2 is the oldest Emacs that Package-Requires promises.
        emacs: ['27.2', '29.4', '30.1', 'snapshot']
    name: Emacs ${{ matrix.emacs }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Compile (warnings are errors)
        run: make compile

      # pdf-tools, pdf-canvas and nov.el are imitated by the tests.
      - name: Test
        run: make test

  # Checks multi-region-pdf-tools.el against the latest pdf-tools.  It
  # is allowed to fail so that a pdf-tools change shows up as a warning
  # here without blocking other work.
  pdf-tools:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: multi-region

      # pdf-tools draws its pages as PNG images, and the Emacs builds of
      # setup-emacs have no PNG support; Ubuntu's Emacs has it.
      - name: Emacs with PNG support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-gtk
          emacs --batch --eval '(unless (image-type-available-p (quote png)) (kill-emacs 1))'

      - name: pdf-tools and tablist sources
        run: |
          git clone --depth 1 https://github.com/vedang/pdf-tools.git
          git clone --depth 1 https://github.com/emacsorphanage/tablist.git

      - name: Check pdf-tools assumptions
        working-directory: multi-region
        run: make test-pdf-tools PDF_TOOLS=../pdf-tools/lisp TABLIST=../tablist
